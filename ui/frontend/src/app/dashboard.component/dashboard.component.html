<div class="dashboard-wrapper">


    <div class="stats-grid">
        <app-stat-card label="Total Shipments" [value]="totalElements()" icon="pi pi-box"
            color="#6366f1"></app-stat-card>
        <app-stat-card label="Active Now" [value]="totalActive()" icon="pi pi-truck" color="#A5F951"></app-stat-card>
        <app-stat-card label="Revenue" value="$42.5k" icon="pi pi-dollar" color="#10b981"></app-stat-card>
        <app-stat-card label="System Health" value="Stable" icon="pi pi-shield" color="#3b82f6"></app-stat-card>
    </div>

    <div class="content-layout">
        <div class="main-column">

            <div class="glass-card chart-box">
                @if (shipmentChartData()) {
                <app-dashboard-chart title="Monthly Performance" [data]="shipmentChartData()"></app-dashboard-chart>
                } @else {
                <div class="skeleton-loader">Loading trends...</div>
                }
            </div>

            <div class="glass-card table-box">
                <app-generic-table title="Recent Shipments" [columns]="shipmentCols" [data]="shipmentData()">
                </app-generic-table>
            </div>
        </div>


    </div>

</div>
