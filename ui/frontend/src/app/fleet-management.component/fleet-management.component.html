<div class="page-container">
  <header class="page-header">
    <div class="title-area">
      <h1>Fleet Management</h1>
      <p>Welcome back, Admin</p>
    </div>
    <div class="actions">
      <button class="add-btn-vibrant" (click)="openAddVehicle()">
        <i class="pi pi-plus"></i>
        <span>Add Vehicle</span>
      </button>
    </div>
  </header>

  <div class="toolbar-section">
    <div class="search-wrapper">
      <i class="pi pi-search"></i>
      <input type="text" placeholder="Search by Vehicle ID..." (input)="onSearch($event)" />
    </div>

    <div class="filter-dropdown-wrapper">
      <i class="pi pi-filter"></i>
      <select class="custom-status-select" (change)="onStatusChange($event)">
        @for (opt of statusOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
      <i class="pi pi-chevron-down chevron"></i>
    </div>
  </div>

  <div class="stats-grid">
    @for (stat of stats(); track stat.label) {
      <app-stat-card [label]="stat.label" [value]="stat.value" [icon]="stat.icon" [color]="stat.color"></app-stat-card>
    }
  </div>

  <div class="section-card table-section">
    <app-generic-table
      title="Fleet Overview"
      [columns]="cols"
      [data]="filteredFleet()"
      (onEdit)="editVehicle($event)"
      (onDelete)="deleteVehicle($event)">
      
      <ng-template #rowActions let-vehicle>
        <div class="actions-cell">
          <button class="icon-btn edit" (click)="editVehicle(vehicle)">
            <i class="pi pi-pencil"></i>
          </button>
          <button class="icon-btn delete" (click)="deleteVehicle(vehicle)">
            <i class="pi pi-trash"></i>
          </button>
        </div>
      </ng-template>
    </app-generic-table>
  </div>
</div>

<app-add-vehicle #addVehicleModal (onSave)="onVehicleAdded($event)"></app-add-vehicle>
