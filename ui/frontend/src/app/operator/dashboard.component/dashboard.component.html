<div class="page-container">
    <div class="page-header">
        <div class="title-area">
            <h1>Operator Dashboard</h1>
            <p>Monitor real-time shipments and dispatch workflows</p>
        </div>
        <div class="action-area">
            <button class="add-btn-vibrant">
                <i class="pi pi-plus"></i> New Shipment
            </button>
        </div>
    </div>

    <div class="stats-grid">
        <app-stat-card label="Total Vehicles" [value]="totalVehicles()" icon="pi pi-car"
            color="#3b82f6"></app-stat-card>
        <app-stat-card label="Active Shipments" [value]="activeCount()" icon="pi pi-box"
            color="#10b981"></app-stat-card>
        <app-stat-card label="Total Clients" [value]="shipments().length" icon="pi pi-users"
            color="#f59e0b"></app-stat-card>
        <app-stat-card label="System Alerts" value="0" icon="pi pi-bell" color="#ef4444"></app-stat-card>
    </div>

    <div class="section-card chart-container" style="margin-bottom: 2rem; padding: 1.5rem;">
        <h4 style="margin-bottom: 1rem;">Monthly Shipment Overview</h4>
        @if (chartData()) {
        <p-chart type="line" [data]="chartData()" [options]="chartOptions()" height="300px"></p-chart>
        } @else {
        <div class="loading-placeholder">Loading trends...</div>
        }
    </div>

    <div class="section-card">
        <div class="table-header">
            <h4>Recent Shipments</h4>
            <div class="toolbar-section">
                <div class="search-wrapper">
                    <i class="pi pi-search"></i>
                    <input type="text" placeholder="Search shipments...">
                </div>
            </div>
        </div>

        <app-generic-table [columns]="columns()" [data]="shipments()">
            <ng-template #rowActions let-row>
                <a class="view-details-link" (click)="viewDetails(row)">View Details</a>
            </ng-template>
        </app-generic-table>
    </div>
</div>
