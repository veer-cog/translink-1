<div class="main-content">
  <header class="page-header">
    <div class="header-content">
      <h1>Route Planning & Optimization</h1>
      <p>Optimize delivery routes for efficiency and cost savings</p>
    </div>
    <button class="btn-create" (click)="openCreateModal()">
      <i class="pi pi-plus"></i> Create Route
    </button>
  </header>

  <div class="stats-grid"> 
    <app-stat-card 
      *ngFor="let stat of stats" 
      [label]="stat.label" 
      [icon]="stat.icon" 
      [value]="stat.value"
      [color]="stat.color"></app-stat-card>
   
  </div>

  <div class="plan-wrapper"> 
    <app-route-plans 
      *ngFor="let r of routes; let i = index"
      [route]="r"
      [showHeader]="i === 0"
      (edit)="openCreateModal($event)">
    </app-route-plans> 
  </div>


  <app-route-insights [stats]="stats.slice(0,3)"></app-route-insights>
</div>


<app-route-form *ngIf="showModal" (close)="closeModal()"></app-route-form>
