# 1. Service Identification
spring.application.name=audit-service
server.port=8082

# 2. Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/translink_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Eureka Client Configuration
# Tells the service where to find the Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# Allows the service to register itself
eureka.client.register-with-eureka=true
# Allows the service to fetch the registry to find other services
eureka.client.fetch-registry=true
